name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "core/**"
      - "schema/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let in-flight ones finish instead of
# racing a half-applied build against a session in progress on a phone.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      # web/ imports core/*.ts by relative path (CLAUDE.md: core/ is shared
      # verbatim, not a published package), and core/schemaValidators.ts
      # depends on ajv/ajv-formats -- declared in the root package.json,
      # not web/'s. Module resolution for that import walks up from
      # core/'s own location to the repo root's node_modules, so it has to
      # exist even though the build itself runs inside web/.
      - name: Install root dependencies (for core/'s ajv/ajv-formats)
        run: npm ci
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
